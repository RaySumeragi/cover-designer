    const m = /^#?([0-9a-f]{6})$/i.exec((hex || '').trim());
    if (!m) return hex;
    const n = parseInt(m[1], 16);
    return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
  };

  function sheetCSS(scope) {
    const sel = scope || ['.sheet', '.card'];
    return Object.keys(SHEET_THEMES).map(k => {
      const t = SHEET_THEMES[k];
      const heads = sel.map(s => `${s}.theme-${k}`).join(',');
      const vars = [
        `--sheet-display:${t.display}`, `--sheet-sans:${t.sans}`, `--sheet-mono:${t.mono}`,
        `--sheet-title:${t.title}`, `--ink:${t.ink}`, `--soft:${t.soft}`,
        `--faint:${t.faint}`, `--hair:${t.hair}`,
        `--sheet-paper:${t.paper}`, `--sheet-paper-alt:${t.paperAlt}`,
        `--sheet-accent:${t.accent}`,
      ].join(';');
      const upper = t.upper
        ? `${sel.map(s => `${s}.theme-${k} h1,${s}.theme-${k} h2`).join(',')}{text-transform:uppercase;letter-spacing:.02em;}`
        : '';
      return `${heads}{${vars};}${upper}`;
    }).join('\n');
  }

/* ── patterns.js ─────────────────────────────────────────────── */

/* ═══════════════════════════════════════════════════════════════════════════
   Studio Design — Patterns
   EINE Definition pro Muster, zwei Backends:
     • Canvas  → getiltes PNG-DataURL (synchron; html2canvas-sicher für Exporte)
     • SVG     → Vektor-Markup (Download im Pattern-Generator, sharp-CLI)

   Ein Muster ist eine Funktion (C, SW) → Ops-Liste, die EINE Kachel der
   Kantenlänge C beschreibt. Ops sind bewusst primitiv, damit beide Renderer
   sie ohne Sonderfälle abbilden können:

     { k:'line',   x1,y1,x2,y2 }
     { k:'rect',   x,y,w,h, fill:true }
     { k:'circle', cx,cy,r, fill?:true }
     { k:'path',   d, fill?:true, join?:'round' }
     { k:'group',  tx,ty, rot, ops:[…] }        rot in Grad

   Ohne `fill` wird gestrichelt … pardon: gestrichen (stroke) mit SW.
═══════════════════════════════════════════════════════════════════════════ */
(function () {
  const SD = (window.StudioDesign = window.StudioDesign || {});

  /* ── Pfad-Helfer ─────────────────────────────────────────────────────────── */
  function polyPath(pts) {
    return pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(2) + ' ' + p[1].toFixed(2)).join(' ') + ' Z';
  }
  function hex6path(cx, cy, r) {
    const pts = [];
    for (let i = 0; i < 6; i++) {
      const a = (Math.PI / 3) * i - Math.PI / 6;
      pts.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]);
    }
    return polyPath(pts);
  }
  function star4path(cx, cy, R, r) {
    const pts = [];
    for (let i = 0; i < 8; i++) {
      const a = (Math.PI / 4) * i - Math.PI / 2;
      const rad = i % 2 === 0 ? R : r;
      pts.push([cx + rad * Math.cos(a), cy + rad * Math.sin(a)]);
    }
    return polyPath(pts);
  }
  function petalPath(pw, ph) {
    const f = n => n.toFixed(2);
    return `M 0 0 C ${f(pw)} ${f(-ph * 0.33)} ${f(pw)} ${f(-ph * 0.67)} 0 ${f(-ph)} ` +
           `C ${f(-pw)} ${f(-ph * 0.67)} ${f(-pw)} ${f(-ph * 0.33)} 0 0`;
  }

  /* ── Register ────────────────────────────────────────────────────────────
     group 'basic' = dezente Flächenraster (früher Cover-Designer)
     group 'motif' = figürliche Muster (früher Malbuch-Pattern-Generator)
     cell/stroke = Vorgaben; die UIs dürfen beides übersteuern.              */
  const PATTERNS = {
    /* — basic — */
    dots: { label: 'Punkte', group: 'basic', cell: 22, stroke: 1,
      ops: C => [{ k: 'circle', cx: C / 2, cy: C / 2, r: C * 0.22, fill: true }] },
    grid: { label: 'Raster', group: 'basic', cell: 22, stroke: 1,
      ops: C => [{ k: 'line', x1: 0.5, y1: 0, x2: 0.5, y2: C }, { k: 'line', x1: 0, y1: 0.5, x2: C, y2: 0.5 }] },
    plus: { label: 'Plus', group: 'basic', cell: 22, stroke: 2,
      ops: C => [{ k: 'line', x1: C / 2, y1: 0, x2: C / 2, y2: C }, { k: 'line', x1: 0, y1: C / 2, x2: C, y2: C / 2 }] },
    diag: { label: 'Diagonal', group: 'basic', cell: 22, stroke: 1.5,
      ops: C => [{ k: 'line', x1: 0, y1: C, x2: C, y2: 0 }] },
    cross: { label: 'Schraffur', group: 'basic', cell: 22, stroke: 1,
      ops: C => [{ k: 'line', x1: 0, y1: C, x2: C, y2: 0 }, { k: 'line', x1: 0, y1: 0, x2: C, y2: C }] },
    vstripe: { label: 'Streifen', group: 'basic', cell: 22, stroke: 1,
      ops: C => [{ k: 'rect', x: 0, y: 0, w: Math.max(2, C * 0.28), h: C, fill: true }] },
    checker: { label: 'Schachbrett', group: 'basic', cell: 22, stroke: 1,
      ops: C => [{ k: 'rect', x: 0, y: 0, w: C / 2, h: C / 2, fill: true },
                 { k: 'rect', x: C / 2, y: C / 2, w: C / 2, h: C / 2, fill: true }] },

    /* — motif — */
    'neon-grid': { label: 'Neon Grid', group: 'motif', cell: 60, stroke: 1,
      ops: C => [{ k: 'path', d: `M ${C} 0 L 0 0 0 ${C}` }] },
    'star-scatter': { label: 'Sterne', group: 'motif', cell: 80, stroke: 1.2,
      ops: C => [{ k: 'path', d: star4path(C / 2, C / 2, C * 0.36, C * 0.14), join: 'round' }] },
    'lightning-repeat': { label: 'Blitz', group: 'motif', cell: 90, stroke: 1.5,
      ops: C => {
        const p = f => (f * C).toFixed(2);
        return [{ k: 'path', join: 'round',
          d: `M ${p(0.60)} ${p(0.02)} L ${p(0.28)} ${p(0.02)} L ${p(0.10)} ${p(0.50)} L ${p(0.40)} ${p(0.50)} ` +
             `L ${p(0.18)} ${p(0.98)} L ${p(0.28)} ${p(0.98)} L ${p(0.58)} ${p(0.52)} L ${p(0.28)} ${p(0.52)} Z` }];
      } },
    'dot-halftone': { label: 'Punkte (offen)', group: 'motif', cell: 50, stroke: 1.2,
      ops: C => [{ k: 'circle', cx: C / 2, cy: C / 2, r: C * 0.30 }] },
    'sakura-geo': { label: 'Sakura', group: 'motif', cell: 90, stroke: 1,
      ops: C => {
        const ph = C * 0.37, pw = C * 0.13, rc = C * 0.065;
        const petals = [];
        for (let i = 0; i < 5; i++) {
          petals.push({ k: 'group', tx: 0, ty: 0, rot: i * 72, ops: [{ k: 'path', d: petalPath(pw, ph), join: 'round' }] });
        }
        petals.push({ k: 'circle', cx: 0, cy: 0, r: rc });
        return [{ k: 'group', tx: C / 2, ty: C / 2, rot: 0, ops: petals }];
      } },
    'hexagon-bloom': { label: 'Hex Bloom', group: 'motif', cell: 70, stroke: 1,
      ops: C => {
        const R = C * 0.42, Ri = C * 0.20, out = [
          { k: 'path', d: hex6path(C / 2, C / 2, R) },
          { k: 'path', d: hex6path(C / 2, C / 2, Ri) },
        ];
        for (let i = 0; i < 6; i++) {
          const a = (Math.PI / 3) * i - Math.PI / 6;
          out.push({ k: 'line',
            x1: C / 2 + Ri * Math.cos(a), y1: C / 2 + Ri * Math.sin(a),
            x2: C / 2 + R * Math.cos(a),  y2: C / 2 + R * Math.sin(a) });
        }
        return out;
      } },
    'diamond-lattice': { label: 'Diamant', group: 'motif', cell: 60, stroke: 1,
      ops: C => [{ k: 'path', d: `M ${C / 2} 0 L ${C} ${C / 2} L ${C / 2} ${C} L 0 ${C / 2} Z` }] },
    'paw-scatter': { label: 'Pfoten', group: 'motif', cell: 90, stroke: 1.2,
      ops: C => {
        const out = [{ k: 'circle', cx: C * 0.50, cy: C * 0.60, r: C * 0.20 }];
        [[0.28, 0.28], [0.50, 0.20], [0.72, 0.28]].forEach(([tx, ty]) =>
          out.push({ k: 'circle', cx: C * tx, cy: C * ty, r: C * 0.09 }));
        return out;
      } },
  };

  const keys = group => Object.keys(PATTERNS).filter(k => !group || PATTERNS[k].group === group);

  /* ── Canvas-Backend ──────────────────────────────────────────────────────
     Rastert eine Kachel als PNG-DataURL. Supersampling, weil html2canvas beim
     300-DPI-Export hochskaliert und 1:1-Tiles dabei ausfransen. Ergebnis wird
     gecacht — Preview und Export nutzen exakt dasselbe Tile (WYSIWYG). */
  const SS = 4;
  const _cache = {};

  function drawOps(ctx, ops, sw) {
    ops.forEach(o => {
      if (o.k === 'group') {
        ctx.save();
        ctx.translate(o.tx || 0, o.ty || 0);
        if (o.rot) ctx.rotate((o.rot * Math.PI) / 180);
        drawOps(ctx, o.ops, sw);
        ctx.restore();
        return;
      }
      ctx.lineWidth = sw;
      ctx.lineJoin = o.join === 'round' ? 'round' : 'miter';
      ctx.beginPath();
      if (o.k === 'line') { ctx.moveTo(o.x1, o.y1); ctx.lineTo(o.x2, o.y2); ctx.stroke(); return; }
      if (o.k === 'rect') { ctx.fillRect(o.x, o.y, o.w, o.h); return; }
      if (o.k === 'circle') {
        ctx.arc(o.cx, o.cy, o.r, 0, Math.PI * 2);
        o.fill ? ctx.fill() : ctx.stroke();
        return;
      }
      if (o.k === 'path') {
        const p = new Path2D(o.d);
        o.fill ? ctx.fill(p) : ctx.stroke(p);
      }
    });
  }

  // → DataURL einer Kachel, oder null bei unbekanntem Key.
  function tileDataURL(key, opts) {
    const p = PATTERNS[key];
    if (!p) return null;
    const o = opts || {};
    const C = o.cell || p.cell;
    const color = o.color || 'rgba(0,0,0,0.06)';
    const sw = o.stroke != null ? o.stroke : p.stroke;
    const ck = `${key}|${C}|${color}|${sw}`;
    if (_cache[ck]) return _cache[ck];

    const cv = document.createElement('canvas');
    cv.width = Math.max(1, Math.round(C * SS));
    cv.height = cv.width;
    const ctx = cv.getContext('2d');
    ctx.scale(SS, SS);
    ctx.fillStyle = color;
    ctx.strokeStyle = color;
    drawOps(ctx, p.ops(C), sw);
    return (_cache[ck] = cv.toDataURL('image/png'));
  }

  // Fertige React/DOM-Styles für ein Kachel-Overlay.
  function tileStyle(key, opts) {
    const uri = tileDataURL(key, opts);
    if (!uri) return null;
    const C = (opts && opts.cell) || PATTERNS[key].cell;
    return { backgroundImage: `url(${uri})`, backgroundRepeat: 'repeat', backgroundSize: `${C}px ${C}px` };
  }

  /* ── SVG-Backend ─────────────────────────────────────────────────────────── */
  function svgOps(ops, sw, color) {
    return ops.map(o => {
      if (o.k === 'group') {
        const tr = `translate(${(o.tx || 0).toFixed(2)},${(o.ty || 0).toFixed(2)})` + (o.rot ? ` rotate(${o.rot})` : '');
        return `<g transform="${tr}">${svgOps(o.ops, sw, color)}</g>`;
      }
      const paint = o.fill ? `fill="${color}"` : `fill="none" stroke="${color}" stroke-width="${sw}"`;
      const join = o.join === 'round' ? ' stroke-linejoin="round"' : '';
      if (o.k === 'line') return `<line x1="${o.x1.toFixed(2)}" y1="${o.y1.toFixed(2)}" x2="${o.x2.toFixed(2)}" y2="${o.y2.toFixed(2)}" stroke="${color}" stroke-width="${sw}"/>`;
      if (o.k === 'rect') return `<rect x="${o.x.toFixed(2)}" y="${o.y.toFixed(2)}" width="${o.w.toFixed(2)}" height="${o.h.toFixed(2)}" fill="${color}"/>`;
      if (o.k === 'circle') return `<circle cx="${o.cx.toFixed(2)}" cy="${o.cy.toFixed(2)}" r="${o.r.toFixed(2)}" ${paint}${join}/>`;
      if (o.k === 'path') return `<path d="${o.d}" ${paint}${join}/>`;
      return '';
    }).join('');
  }

  // Vollständiges SVG-Dokument, W×H mit gekachetem Muster gefüllt.
  function patternSVG(key, W, H, opts) {
    const p = PATTERNS[key];
    if (!p) return null;
    const o = opts || {};
    const C = o.cell || p.cell;
    const sw = o.stroke != null ? o.stroke : p.stroke;
    const color = o.color || '#000000';
    const id = 'sd-' + key.replace(/[^a-z0-9]/gi, '');
    const inner = svgOps(p.ops(C), sw, color);
    return `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">` +
      `<defs><pattern id="${id}" x="0" y="0" width="${C}" height="${C}" patternUnits="userSpaceOnUse">${inner}</pattern></defs>` +
      `<rect width="${W}" height="${H}" fill="url(#${id})"/></svg>`;
  }

  SD.PATTERNS = PATTERNS;
  SD.patternKeys = keys;
  SD.tileDataURL = tileDataURL;
  SD.tileStyle = tileStyle;
  SD.patternSVG = patternSVG;
  SD.patternOps = (key, C) => (PATTERNS[key] ? PATTERNS[key].ops(C || PATTERNS[key].cell) : null);
})();

/* ── handoff.js ─────────────────────────────────────────────── */

/* ═══════════════════════════════════════════════════════════════════════════
   Studio Design — Handoff
   Presets zwischen den Tools austauschen, ohne Server und ohne gemeinsamen
   Origin: übertragen wird nicht das gerenderte Bild, sondern die Parameter.
   Jedes Tool rendert daraus selbst in seiner eigenen Auflösung — der Cover-
   Designer in 300 DPI, Cloth Sheet mit Export-Scale 3, der Generator als SVG.

   Transport ist die Zwischenablage. Die funktioniert auch unter file://, wo
   localStorage zwischen den Tools getrennt ist (jede Datei = eigener Origin).

     const preset = { kind:'pattern', pattern:'sakura-geo', cell:90, … };
     await StudioDesign.Handoff.copy(preset);      // im Generator
     const p = await StudioDesign.Handoff.paste(); // im Ziel-Tool
═══════════════════════════════════════════════════════════════════════════ */
(function () {
  const SD = (window.StudioDesign = window.StudioDesign || {});

  const MAGIC = 'STUDIO-PRESET';
  const VERSION = 1;

  function encode(preset) {
    return `${MAGIC} v${VERSION} ` + JSON.stringify(preset);
  }

  // Toleranter Parser: akzeptiert die Hülle, nacktes JSON und Text mit Umbrüchen
  // drumherum (Zwischenablagen aus Editoren hängen gern Whitespace an).
  function decode(text) {
    if (!text) return null;
    let s = String(text).trim();
    const m = new RegExp('^' + MAGIC + '\\s+v(\\d+)\\s+').exec(s);
    if (m) {
      if (Number(m[1]) > VERSION) return null; // neueres Format — nicht raten
      s = s.slice(m[0].length);
    }
    if (s[0] !== '{') return null;
    try {
      const p = JSON.parse(s);
      return p && typeof p === 'object' && p.kind ? p : null;
    } catch (e) { return null; }
  }

  /* ── Zwischenablage ──────────────────────────────────────────────────────
     navigator.clipboard braucht einen Secure Context und eine User-Geste;
     beides ist bei einem Button-Klick gegeben, aber unter file:// zickt
     Chrome je nach Version. Darum der execCommand-Fallback. */
  async function writeText(text) {
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(text);
        return true;
      }
    } catch (e) { /* Fallback unten */ }
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
      document.body.appendChild(ta);
      ta.select();
      const ok = document.execCommand('copy');
      ta.remove();
      return ok;
    } catch (e) { return false; }
  }

  async function readText() {
    try {
      if (navigator.clipboard && navigator.clipboard.readText) {
        return await navigator.clipboard.readText();
      }
    } catch (e) { /* Fallback unten */ }
    // Kein Leserecht → den Nutzer einfügen lassen.
    return window.prompt('Preset hier einfügen (Strg+V):', '') || '';
  }

  async function copy(preset) { return writeText(encode(preset)); }

  async function paste() { return decode(await readText()); }

  /* ── Preset-Konstruktoren ────────────────────────────────────────────────
     Nur Felder, die jedes Ziel-Tool auch versteht. `kind` entscheidet, welche
     Sektion ein Tool beim Einfügen befüllt. */
  const pattern = o => ({
    kind: 'pattern', pattern: o.pattern, cell: o.cell, stroke: o.stroke,
    opacity: o.opacity, color: o.color || null, auto: o.auto !== false,
  });
  const theme = o => ({
    kind: 'theme', theme: o.theme,
    fonts: o.fonts || null, colors: o.colors || null,
  });
  const palette = o => ({ kind: 'palette', colors: o.colors, name: o.name || '' });

  // Kurzbeschreibung fürs UI ("Eingefügt: Muster sakura-geo").
  function describe(p) {
    if (!p) return '';
    if (p.kind === 'pattern') return `Muster ${p.pattern}`;
    if (p.kind === 'theme') return `Theme ${p.theme}`;
    if (p.kind === 'palette') return `Palette (${(p.colors || []).length} Farben)`;
    return p.kind;
  }

  SD.Handoff = { MAGIC, VERSION, encode, decode, copy, paste, writeText, readText, describe, make: { pattern, theme, palette } };
})();
/* @studio-design:end */

    .palettes { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }

<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useRef, useEffect } = React;

/* ── Settings-Persistenz (localStorage) ───────────────────────────────────── */
const LS_KEY = 'cd2-settings';
function loadSaved() {
  try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; } catch (e) { return {}; }
}

/* ── Projekt-Datei (Speichern/Laden inkl. Bilder) ──────────────────────────────
   Auto-Save (oben) hält nur Texte/Farben/Schriften — Bilder sind blob:-ObjectURLs
   und überleben kein F5. Für ein echtes "Cover wiederherstellen" exportieren wir
   stattdessen eine .json-Datei, in der die Bilder als data:-URLs eingebettet sind.
   Beim Laden werden die data:-URLs direkt als Bildquelle verwendet (funktionieren
   in Vorschau und html2canvas-Export gleichermaßen). */
const PROJECT_VERSION = 1;
async function urlToDataURL(url) {
  if (!url) return null;
  if (url.startsWith('data:')) return url; // schon eingebettet (z.B. aus geladenem Projekt)
  try {
    const blob = await (await fetch(url)).blob();
    return await new Promise(res => {
      const fr = new FileReader();
      fr.onload = () => res(fr.result); fr.onerror = () => res(null);
      fr.readAsDataURL(blob);
    });
  } catch (e) { return null; }
}
async function serializeImages(imagesByTheme) {
  const out = {};
  for (const [k, v] of Object.entries(imagesByTheme || {})) {
    if (!v) continue;
    out[k] = {
      hero:    await urlToDataURL(v.hero),
      heroPBN: await urlToDataURL(v.heroPBN),
      pages:   await Promise.all((v.pages || []).map(urlToDataURL)),
      baLine:  await Promise.all((v.baLine  || []).map(urlToDataURL)),
      baColor: await Promise.all((v.baColor || []).map(urlToDataURL)),
    };
  }
  return out;
}

/* ── Brand tokens ─────────────────────────────────────────────────────────── */
const BRAND = {
  crimson:'#a4161a', crimsonHover:'#8b1214', gold:'#e38f14', goldHover:'#c17e10',
  dark:'#161a1d', black:'#0b090a', light:'#f5f3f4', white:'#ffffff',
};
const ANTON = '"Anton","Helvetica Neue",Arial,sans-serif';
const SANS = '"Helvetica Neue",Helvetica,Arial,sans-serif';
// Print-Seitenformat der Front/Back/What's-Inside-Artboards. US-Letter (8.5×11) → 630×815
// (630 × 279.4/215.9). Der Letter-PDF-Export füllt damit randlos; A4 wird zentriert eingepasst.
const PAGE_W = 630, PAGE_H = 815;

function splitTitle(title) {
  const words = String(title || '').trim().split(/\s+/).filter(Boolean);
  if (words.length <= 1) return [words[0] || '', ''];
  const cut = Math.ceil(words.length / 2);
  return [words.slice(0, cut).join(' '), words.slice(cut).join(' ')];
}
function withAlpha(hex, a) {
  const h = hex.replace('#', '');
  const r = parseInt(h.slice(0,2),16), g = parseInt(h.slice(2,4),16), b = parseInt(h.slice(4,6),16);
  return `rgba(${r},${g},${b},${a})`;
}
function lum(hex) {
  const h = hex.replace('#', '');
  const r = parseInt(h.slice(0,2),16), g = parseInt(h.slice(2,4),16), b = parseInt(h.slice(4,6),16);
  return (0.299*r + 0.587*g + 0.114*b) / 255;
}
function isDark(hex) { return lum(hex) < 0.55; }
// Resolve a theme + the 5 user-editable palette tokens into the full token set the
// artboards consume; dependent tokens (ink/sub/watermark/authorOnDark) re-derive from ground.
function resolveColors(theme, ov) {
  ov = ov || {};
  const ground      = ov.ground      || theme.ground;
  const titleColor  = ov.titleColor  || theme.titleColor;
  const accentColor = ov.accentColor || theme.accentColor;
  const badgeBg     = ov.badgeBg     || theme.badgeBg;
  const badgeColor  = ov.badgeColor  || theme.badgeColor;
  const dark = isDark(ground);
  return {
    ...theme,
    ground, titleColor, accentColor, badgeBg, badgeColor,
    ink:         dark ? BRAND.light : BRAND.dark,
    authorOnDark: dark,
    subColor:    dark ? withAlpha(BRAND.white, 0.72) : withAlpha(BRAND.black, 0.66),
    eyebrowColor: accentColor,
    watermark:   dark ? withAlpha(BRAND.white, 0.4) : withAlpha(BRAND.black, 0.3),
  };
}
function frameRadius(shape) {
  if (shape === 'arch') return '46% 46% 12px 12px / 28% 28% 12px 12px';
  if (shape === 'round') return '24px';
  return '6px';
}

/* ── Outline icons ────────────────────────────────────────────────────────── */
function StarLine({ size=22, color=BRAND.gold, w=2, style }) {
  return (<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth={w}
    strokeLinejoin="round" strokeLinecap="round" style={{ display:'block', ...style }}>
    <polygon points="12,3 14.6,9.3 21.4,9.6 16,13.9 17.9,20.5 12,16.6 6.1,20.5 8,13.9 2.6,9.6 9.4,9.3" /></svg>);
}
function HeartLine({ size=22, color=BRAND.crimson, w=2, style }) {
  return (<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth={w}
    strokeLinejoin="round" strokeLinecap="round" style={{ display:'block', ...style }}>
    <path d="M12 20s-6.5-4.6-6.5-10A3.7 3.7 0 0 1 12 7.2 3.7 3.7 0 0 1 18.5 10c0 5.4-6.5 10-6.5 10z" /></svg>);
}
function SparkleLine({ size=22, color=BRAND.gold, w=2, style }) {
  return (<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth={w}
    strokeLinejoin="round" strokeLinecap="round" style={{ display:'block', ...style }}>
    <path d="M12 3 C12.6 8 12.6 8 17 9 C12.6 10 12.6 10 12 15 C11.4 10 11.4 10 7 9 C11.4 8 11.4 8 12 3 Z" /></svg>);
}
function DiamondLine({ size=20, color=BRAND.gold, w=2, style }) {
  return (<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth={w}
    strokeLinejoin="round" style={{ display:'block', ...style }}>
    <path d="M12 3 L20 11 L12 21 L4 11 Z" /><path d="M4 11 H20" /></svg>);
}
function Motif({ kind, color, color2, placements }) {
  const Icon = kind === 'hearts' ? HeartLine : kind === 'sparkles' ? SparkleLine
    : kind === 'diamonds' ? DiamondLine : StarLine;
  return (<>{placements.map((p, i) => (
    <Icon key={i} size={p.size} color={i % 3 === 2 && color2 ? color2 : color}
      style={{ position:'absolute', top:p.top, bottom:p.bottom, left:p.left, right:p.right,
               transform:`rotate(${p.r || 0}deg)` }} />))}</>);
}
function Halftone({ color='rgba(255,255,255,0.08)', size=13, style }) {
  return (<div style={{ position:'absolute', inset:0, pointerEvents:'none',
    backgroundImage:`radial-gradient(${color} 22%, transparent 24%)`,
    backgroundSize:`${size}px ${size}px`, ...style }} />);
}

/* ── Auswechselbare Hintergrund-Muster ─────────────────────────────────────
   Die Muster-Definitionen liegen in 99-resources/studio-design/src/patterns.js
   (geteilt mit dem Pattern-Generator und Cloth Sheet). Gerendert wird ein
   getiltes Canvas-PNG statt eines CSS-Gradients: html2canvas 1.4.1 tilt
   Gradient-Backgrounds mit background-size beim Export nicht zuverlässig
   (Muster verschwindet im PNG/PDF). Preview und Export nutzen exakt dasselbe
   Tile (WYSIWYG). 'theme' = Theme-Eigenlook (kein Overlay), 'none' = leer. */
const BG_PATTERNS = Object.assign(
  { theme:{ label:'Theme-Standard' }, none:{ label:'Keins' } },
  ...StudioDesign.patternKeys().map(k => ({ [k]:{ label:StudioDesign.PATTERNS[k].label, kind:k } })));

function patternColor(t, ground) {
  const op = t.bgPatternOpacity != null ? t.bgPatternOpacity : 0.06;
  if (!t.bgPatternAuto && t.bgPatternColor) return withAlpha(t.bgPatternColor, op);
  return isDark(ground) ? `rgba(255,255,255,${op})` : `rgba(0,0,0,${op})`; // dezent, an Grund angepasst
}
function BgPattern({ t, ground }) {
  const p = BG_PATTERNS[t.bgPattern];
  if (!p || !p.kind) return null; // 'theme' / 'none' / unbekannt → kein Overlay
  const style = StudioDesign.tileStyle(p.kind, {
    cell: t.bgPatternSize || StudioDesign.PATTERNS[p.kind].cell,
    stroke: t.bgPatternStroke || undefined,
    color: patternColor(t, ground),
  });
  if (!style) return null;
  return <div style={{ position:'absolute', inset:0, pointerEvents:'none', ...style }} />;
}

/* Muster-Presets mit dem Pattern-Generator und Cloth Sheet austauschen.
   Übertragen werden nur die Parameter — jedes Tool rendert daraus selbst
   in seiner eigenen Auflösung. Transport ist die Zwischenablage, damit es
   auch unter file:// funktioniert (dort teilt sich kein localStorage). */
function PatternHandoff({ t, set }) {
  const [msg, setMsg] = React.useState('');
  const note = s => { setMsg(s); setTimeout(() => setMsg(''), 2500); };
  const live = BG_PATTERNS[t.bgPattern] && BG_PATTERNS[t.bgPattern].kind;

  async function copy() {
    if (!live) return note('Erst ein Muster wählen.');
    const ok = await StudioDesign.Handoff.copy(StudioDesign.Handoff.make.pattern({
      pattern: t.bgPattern,
      cell: t.bgPatternSize,
      stroke: t.bgPatternStroke || StudioDesign.PATTERNS[t.bgPattern].stroke,
      opacity: t.bgPatternOpacity,
      color: t.bgPatternAuto ? null : t.bgPatternColor,
      auto: t.bgPatternAuto,
    }));
    note(ok ? 'Preset kopiert.' : 'Kopieren fehlgeschlagen.');
  }
  async function paste() {
    const p = await StudioDesign.Handoff.paste();
    if (!p) return note('Kein gültiges Preset in der Zwischenablage.');
    if (p.kind !== 'pattern') return note(`Das ist ein ${StudioDesign.Handoff.describe(p)}-Preset.`);
    if (!StudioDesign.PATTERNS[p.pattern]) return note(`Unbekanntes Muster: ${p.pattern}`);
    set('bgPattern', p.pattern);
    if (p.cell != null) set('bgPatternSize', p.cell);

    note(`Übernommen: ${StudioDesign.PATTERNS[p.pattern].label}`);
  }

  return (<>
    <div className="btnrow" style={{ display:'flex', gap:6, marginTop:6 }}>
      <button className="btn sec-btn" onClick={copy}>⧉ Preset kopieren</button>
      <button className="btn sec-btn" onClick={paste}>⤓ Preset einfügen</button>

  </>);
}

const BADGE_POS = ['top-left','top-right','bottom-left','bottom-right','middle-left','middle-right'];

const STAR_CLIP = 'polygon(50% 0%,61% 16%,79% 9%,76% 28%,95% 31%,83% 47%,100% 56%,81% 62%,87% 81%,68% 76%,62% 95%,50% 81%,38% 95%,32% 76%,13% 81%,19% 62%,0% 56%,17% 47%,5% 31%,24% 28%,21% 9%,39% 16%)';

// Stackable overlay layer: places Vol / variant / promo / level into free corners (v1-style collision dodge).
function Overlays({ theme, t, pad, reserved=[], scale=1, promoSize=104 }) {
  if (!t.showBadges) return null;
  const occupied = new Set(reserved);
  const place = pref => {
    let c = pref;
    if (occupied.has(c)) {
      const flip = c.startsWith('top') ? c.replace('top','bottom')
                 : c.startsWith('bottom') ? c.replace('bottom','top') : c;
      if (!occupied.has(flip)) c = flip;
    }
    occupied.add(c);
    return c;
  };
  const out = [];
  const vol = (t.volumeText || '').trim();
  if (vol) {
    const c = place(t.posVol || 'top-left');
    out.push(<div key="vol" style={{ position:'absolute', ...cornerStyle(c, pad) }}>
      <VolStamp text={vol} theme={theme} scale={scale} /></div>);
  }
  const variant = t.variantType === 'CUSTOM' ? (t.variantCustom || '') : (t.variantType || '');
  if (t.variantType && t.variantType !== 'none' && variant.trim()) {
    const c = place(t.posVariant || 'bottom-left');
    out.push(<div key="variant" style={{ position:'absolute', ...cornerStyle(c, pad) }}>
      <VariantPill text={variant.trim()} theme={theme} scale={scale} /></div>);
  }
  if (t.promoBadge && (t.promoBadgeText || '').trim()) {
    const c = place(t.posPromo || 'middle-right');
    out.push(<div key="promo" style={{ position:'absolute', ...cornerStyle(c, pad) }}>
      <PromoStamp text={t.promoBadgeText.trim().toUpperCase()} shape={t.promoBadgeShape}
        color={t.promoBadgeColor} textColor={t.promoBadgeTextColor} size={promoSize} /></div>);
  }
  if (t.showLevelBadge !== false && t.seriesLevel) {
    const c = place(t.posLevel || 'top-right');
    out.push(<div key="level" style={{ position:'absolute', ...cornerStyle(c, pad) }}>
      <LevelBadge level={t.seriesLevel} theme={theme} scale={scale} /></div>);
  }
  return <>{out}</>;
}

/* ── Real image slot (replaces <image-slot>; object-fit:cover) ─────────────── */
// Render a real <img> (NOT a CSS background): html2canvas draws <img> straight from the
// source bitmap at full resolution, while background-images get rasterised at CSS size and
// then upscaled by the export scale → blurry. html2canvas ignores object-fit, so we emulate
// cover/contain ourselves via absolute %-positioning computed from the image's natural ratio.
function ImgSlot({ src, radius=4, placeholder='Drop image', fit='cover', style }) {
  const boxRef = useRef(null), imgRef = useRef(null);
  const [pos, setPos] = useState(null);
  // Measure box + natural ratio and emulate object-fit via %-positioning. Must re-run not just on
  // image load but whenever the box aspect or fit changes (e.g. user switches Asset-Format/Anpassung):
  // the <img> src is unchanged so onLoad won't re-fire, and a stale `pos` from the old box AR would
  // stretch the image ("verzogen"). useLayoutEffect + ResizeObserver keep it correct on every resize.
  function measure() {
    const img = imgRef.current, box = boxRef.current;
    if (!img || !box || !img.naturalWidth) return;
    const bw = box.clientWidth, bh = box.clientHeight;
    if (!bw || !bh) return;
    const boxAR = bw / bh, imgAR = img.naturalWidth / img.naturalHeight;
    const cover = fit !== 'contain';
    // cover: overflow on the wider axis; contain: letterbox on the narrower axis.
    if (cover ? imgAR > boxAR : imgAR <= boxAR) {
      const w = (imgAR / boxAR) * 100; setPos({ height:'100%', width:w + '%', top:0, left:(100 - w) / 2 + '%' });
    } else {
      const h = (boxAR / imgAR) * 100; setPos({ width:'100%', height:h + '%', left:0, top:(100 - h) / 2 + '%' });
    }
  }
  React.useLayoutEffect(() => { measure(); }, [src, fit]);
  useEffect(() => {
    const box = boxRef.current;
    if (!box || typeof ResizeObserver === 'undefined') return;
    const ro = new ResizeObserver(() => measure()); ro.observe(box);
    return () => ro.disconnect();
  }, [fit]);
  return (<div ref={boxRef} style={{ position:'relative', width:'100%', height:'100%', borderRadius:radius, overflow:'hidden',
    background:'#e9e6e2', display:'flex', alignItems:'center', justifyContent:'center', ...style }}>
    {src
      ? <img ref={imgRef} src={src} onLoad={measure} alt="" style={{ position:'absolute', display:'block',
          ...(pos || { width:'100%', height:'100%', objectFit:fit, top:0, left:0 }) }} />
      : <span style={{ fontFamily:SANS, fontSize:12, letterSpacing:'0.04em', color:'#9a958d', textAlign:'center', padding:8 }}>{placeholder}</span>}
  </div>);
}
// Split cover (v1 feature): both srcs frame the SAME box; left half shows the PBN/outline
// version, right half the colored one → seamless "before/after" reveal. Falls back to single.
function Fill({ src, srcPBN, radius=4, placeholder='Drop image' }) {
  if (src && srcPBN) {
    // Each half clips a full-box cover composition; the inner 200%-wide div equals the full box,
    // so ImgSlot (real <img>) measures it and covers correctly — sharp on html2canvas export.
    return (<div style={{ position:'relative', width:'100%', height:'100%', borderRadius:radius, overflow:'hidden', background:'#e9e6e2' }}>
      <div style={{ position:'absolute', left:0, top:0, width:'50%', height:'100%', overflow:'hidden' }}>
        <div style={{ position:'absolute', left:0, top:0, width:'200%', height:'100%' }}>
          <ImgSlot src={srcPBN} radius={0} /></div></div>
      <div style={{ position:'absolute', right:0, top:0, width:'50%', height:'100%', overflow:'hidden' }}>
        <div style={{ position:'absolute', right:0, top:0, width:'200%', height:'100%' }}>
          <ImgSlot src={src} radius={0} /></div></div>
      <div style={{ position:'absolute', top:0, bottom:0, left:'50%', width:2, marginLeft:-1, background:'rgba(255,255,255,0.6)' }} />
    </div>);
  }
  return <ImgSlot src={src || srcPBN} radius={radius} placeholder={placeholder} />;
}
// Asset-Orientierung: Seitenverhältnis (B/H) der Vorschau-Kacheln, damit hochkant/quer eingeladene
// Bilder nicht schlecht mittig beschnitten werden. tileBox passt eine Kachel ohne Überlauf in maxW×maxH ein.
const ASSET_AR = { portrait: 3/4, square: 1, wide: 4/3 };
function tileBox(ar, maxW, maxH) {
  let w = maxW, h = maxW / ar;
  if (h > maxH) { h = maxH; w = h * ar; }
  return { w: Math.round(w), h: Math.round(h) };
}
// Einheitliches Kachel-Raster für Back-Vorschau, What's-Inside & Gallery — respektiert assetAspect + assetFit.
function AssetGrid({ theme, t, pages, indices, cols, maxW, maxH, gap, placeholderBase, style }) {
  const ar = ASSET_AR[t.assetAspect] || 1, fit = t.assetFit || 'cover';
  const cell = tileBox(ar, maxW, maxH);
  const rad = theme.frame === 'round' ? 14 : 6;
  return (<div style={{ display:'grid', gridTemplateColumns:`repeat(${cols}, ${cell.w}px)`, gridAutoRows:`${cell.h}px`, gap, justifyContent:'center', ...style }}>
    {indices.map(i => (
      <div key={i} style={{ width:cell.w, height:cell.h, background:theme.frameBg, border:`1.5px solid ${theme.frameBorder}`,
        borderRadius:rad, padding:5, boxShadow:'0 4px 12px rgba(11,9,10,0.12)' }}>
        <ImgSlot src={pages[i]} radius={theme.frame === 'round' ? 8 : 3} placeholder={`${placeholderBase} ${i+1}`} fit={fit} /></div>))}
  </div>);
}
// Frame box that holds a hero image, honouring theme shape/border (front/thumb/teaser).
// shape/bw default to the theme's, but can be overridden (z.B. kleine Collage-Kacheln).
function HeroFrame({ theme, src, srcPBN, w, h, pad, placeholder, shadow, top, left, right, shape, bw }) {
  const fshape = shape || theme.frame;
  const fbw = bw != null ? bw : theme.frameBorderW;
  const inner = fshape === 'round' ? 14 : fshape === 'arch' ? 2 : fshape === 'circle' ? 999 : 4;
  const isCircle = fshape === 'circle';
  return (<div style={{
    position:'absolute', top, left, right, width:w, height:h, boxSizing:'border-box',
    background:theme.frameBg, border:`${fbw}px solid ${theme.frameBorder}`,
    borderRadius:isCircle ? '50%' : frameRadius(fshape), padding:pad, boxShadow:shadow }}>
    {fshape === 'arch'
      ? <div style={{ width:'100%', height:'100%', borderRadius:'42% 42% 4px 4px / 27% 27% 4px 4px', overflow:'hidden' }}>
          <Fill src={src} srcPBN={srcPBN} radius={2} placeholder={placeholder} /></div>
      : <Fill src={src} srcPBN={srcPBN} radius={isCircle ? 999 : inner} placeholder={placeholder} />}
  </div>);
}
// Auswechselbare Hero-Anordnungen innerhalb einer Box (top/left/w/h des bisherigen Hero-Frames).
// 'single' = ein großer Frame (Standard), 'bigtop3' = groß oben + 3 klein, 'grid4' = 2×2, 'circle' = Kreis.
function HeroLayout({ layout, theme, hero, heroPBN, pages, top, left, w, h, pad, placeholder, shadow }) {
  pages = pages || [];
  const gap = 12;
  if (layout === 'grid4') {
    const cw = (w - gap) / 2, ch = (h - gap) / 2;
    const cells = [{ src:hero, pbn:heroPBN }, { src:pages[0] }, { src:pages[1] }, { src:pages[2] }];
    return (<>{cells.map((c, i) => (
      <HeroFrame key={i} theme={theme} src={c.src} srcPBN={c.pbn} shape="rect" bw={2}
        w={cw} h={ch} top={top + Math.floor(i/2)*(ch+gap)} left={left + (i%2)*(cw+gap)}
        pad={7} placeholder={i === 0 ? placeholder : `#${i+1}`} shadow={i === 0 ? shadow : '0 4px 12px rgba(11,9,10,0.16)'} />))}</>);
  }
  if (layout === 'bigtop3') {
    const bigH = Math.round(h * 0.6), smallH = h - bigH - gap, sw = (w - 2*gap) / 3;
    const out = [<HeroFrame key="big" theme={theme} src={hero} srcPBN={heroPBN}
      w={w} h={bigH} top={top} left={left} pad={pad} placeholder={placeholder} shadow={shadow} />];
    for (let i = 0; i < 3; i++) out.push(
      <HeroFrame key={i} theme={theme} src={pages[i]} shape="rect" bw={2}
        w={sw} h={smallH} top={top + bigH + gap} left={left + i*(sw+gap)}
        pad={6} placeholder={`#${i+1}`} shadow="0 4px 12px rgba(11,9,10,0.16)" />);
    return <>{out}</>;
  }
  if (layout === 'circle') {
    const d = Math.min(w, h);
    return <HeroFrame theme={theme} src={hero} srcPBN={heroPBN} shape="circle"
      w={d} h={d} top={top + (h-d)/2} left={left + (w-d)/2} pad={pad} placeholder={placeholder} shadow={shadow} />;
  }
  return <HeroFrame theme={theme} src={hero} srcPBN={heroPBN}
    w={w} h={h} top={top} left={left} pad={pad} placeholder={placeholder} shadow={shadow} />;
}

/* ── Themes & Paletten ────────────────────────────────────────────────────

const HERO_PH = { kids:'Animal lineart', anime:'Manga lineart', fantasy:'Fantasy lineart', kawaii:'Chibi lineart',
  colorlabs:'Lineart', standard:'Lineart', boldpop:'Lineart', handmade:'Lineart', prestige:'Lineart' };
const themeFont  = theme => theme.titleFont || ANTON;

const FRONT_MOTIF = [

/* ── Vollbild-/Cinematic-Layout (aus v1 _renderFullBg) ─────────────────────────
   Hero füllt randlos die ganze Fläche (Split: PBN links / farbig rechts). Titel liegt
   als Overlay leicht schräg über der hellen PBN-Seite, mit dezentem dunklem Scrim für
   Lesbarkeit. Kein Hintergrund-Muster, kein Rahmen, keine Motive. */
function FullBleedCover({ theme, t, hero, heroPBN, pages, w, h, kind }) {
  const [l1, l2] = splitTitle(t.title);
  const longest = Math.max(l1.length, l2.length);
  const sz = kind === 'cover'
      ? { tf: longest > 11 ? 70 : longest > 8 ? 84 : 96, eb:19, au:24, pad:48, rot:-4, maxW:0.70 }
    : kind === 'thumb'
      ? { tf: longest > 11 ? 46 : longest > 8 ? 54 : 62, eb:15, au:18, pad:30, rot:-4, maxW:0.82 }
      : { tf: longest > 11 ? 60 : longest > 8 ? 72 : 84, eb:17, au:20, pad:40, rot:-3, maxW:0.60 };
  return (<div style={{ width:w, height:h, background:theme.ground, position:'relative', overflow:'hidden', fontFamily:SANS }}>
    <div style={{ position:'absolute', inset:0 }}>
      <Fill src={hero} srcPBN={heroPBN} radius={0} placeholder={HERO_PH[theme.key]} /></div>
    {/* Scrim links über der PBN-Seite, damit der Titel auf jedem Bild lesbar bleibt */}
    <div style={{ position:'absolute', top:0, bottom:0, left:0, width:`${Math.round(sz.maxW*100)}%`,
      background:`linear-gradient(90deg, ${withAlpha(BRAND.black,0.55)} 0%, ${withAlpha(BRAND.black,0.30)} 60%, rgba(0,0,0,0) 100%)` }} />
    <div style={{ position:'absolute', left:sz.pad, bottom:sz.pad + sz.au + 18, width:`${Math.round(sz.maxW*100)}%`,
      transform:`rotate(${sz.rot}deg)`, transformOrigin:'left bottom' }}>
      <div style={{ fontFamily:SANS, fontWeight:700, fontSize:sz.eb, letterSpacing:'0.12em', textTransform:'uppercase',
        lineHeight:1.2, color:theme.accentColor, textShadow:'0 2px 8px rgba(0,0,0,0.7)', marginBottom:12 }}>{t.subtitle}</div>
      <div style={{ fontFamily:themeFont(theme), lineHeight:0.9, textTransform:'uppercase', textShadow:'0 4px 18px rgba(0,0,0,0.55)' }}>
        <div style={{ fontSize:sz.tf, color:BRAND.white }}>{l1}</div>
        {l2 && <div style={{ fontSize:sz.tf, color:theme.accentColor }}>{l2}</div>}
      </div>
    </div>
    <div style={{ position:'absolute', left:sz.pad, bottom:sz.pad, display:'flex', alignItems:'center', gap:10 }}>
      <span style={{ fontFamily:SANS, fontWeight:700, fontSize:11, letterSpacing:'0.28em', color:withAlpha(BRAND.white,0.7), textShadow:'0 1px 4px rgba(0,0,0,0.6)' }}>BY</span>
      <span style={{ fontFamily:themeFont(theme), fontSize:sz.au, letterSpacing:'0.02em', textTransform:'uppercase', color:BRAND.white, textShadow:'0 2px 8px rgba(0,0,0,0.6)' }}>{t.author}</span>
    </div>
    <Watermark color={withAlpha(BRAND.white,0.7)} text={t.website} show={t.showWebsite} />
    <Overlays theme={theme} t={t} pad={kind === 'thumb' ? 18 : 24} reserved={['top-left']} scale={kind === 'thumb' ? 0.82 : 1} promoSize={kind === 'cover' ? 116 : 104} />
  </div>);
}

/* ── Artboards ────────────────────────────────────────────────────────────── */
function FrontCover({ theme, t, hero, heroPBN, pages }) {
  if (t.frontLayout === 'fullbleed') return <FullBleedCover theme={theme} t={t} hero={hero} heroPBN={heroPBN} pages={pages} w={630} h={PAGE_H} kind="cover" />;
  const [l1, l2] = splitTitle(t.title);
  const longest = Math.max(l1.length, l2.length);
  const titleFs = longest > 11 ? 56 : longest > 8 ? 66 : 76;
  const onDark = theme.authorOnDark;
  return (<div style={{ width:630, height:PAGE_H, background:theme.ground, position:'relative', overflow:'hidden', fontFamily:SANS }}>
    <BgPattern t={t} ground={theme.ground} />
    {theme.motif === 'halftone'
      ? <Halftone color={withAlpha(BRAND.white,0.07)} size={13} />

/* ── Export helpers ───────────────────────────────────────────────────────── */
async function captureNode(node, scale) {
  await document.fonts.ready;
  const prev = node.style.transform;
  node.style.transform = 'none';
  // Ein Frame abwarten, damit das zurückgesetzte transform greift. In einem Hintergrund-Tab
  // feuert requestAnimationFrame nicht → zusätzlicher setTimeout-Fallback, sonst hängt der
  // Export für immer, wenn man während des Exports das Fenster wechselt.
  await new Promise(r => {
    let done = false;
    const fin = () => { if (!done) { done = true; r(); } };
    requestAnimationFrame(() => requestAnimationFrame(fin));
    setTimeout(fin, 150);
  });
  const canvas = await html2canvas(node, {
    scale, backgroundColor:null, useCORS:true, allowTaint:true, logging:false,
    width:node.offsetWidth, height:node.offsetHeight,
  });
  node.style.transform = prev;
  return canvas;
}
function downloadCanvas(canvas, filename) {
  const a = document.createElement('a');
  a.download = filename; a.href = canvas.toDataURL('image/png'); a.click();
}
// Web-Export: ein (in ~2× gerendertes) Canvas verlustfrei auf eine Ziel-Langkante herunterskalieren.
// Hochwertiges Downsampling (imageSmoothing) → scharfe, kleine Shop-Bilder ohne Treppchen.
const WEB_MAX_EDGE = 1200; // Langkante der Web-/Shop-Bilder in px
function scaleCanvasToMax(src, maxEdge) {
  const long = Math.max(src.width, src.height);
  if (long <= maxEdge) return src;
  const r = maxEdge / long;
  const out = document.createElement('canvas');
  out.width = Math.round(src.width * r); out.height = Math.round(src.height * r);
  const ctx = out.getContext('2d');
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(src, 0, 0, out.width, out.height);
  return out;
}
/* ── PNG-Ziele für das nachgelagerte PDF-Tool ──────────────────────────────────
   Das Folge-Tool setzt jedes Motiv in einen festen Rahmen (Maße @300 DPI) und
   begrenzt Importe auf 3508 px Langkante. Rendern wir nativ (630×815 @4.85 →
   3055×3953), rechnet es jedes PNG ein zweites Mal herunter → weiche Kanten.
   Mit aktivem Ziel rastert der Export deshalb direkt in Rahmen-Pixeln: ein
   einziger Rasterisier-Schritt, danach im Tool kein Resampling mehr. */
const PDF_TARGET_CAP = 3508; // Import-Limit des Folge-Tools (Langkante)
const PDF_TARGETS = {
  off:     { label: 'aus (nativ)' },
  freebie: { label: 'Freebie · LETTER', w: 2432, h: 3182 }, // Motiv-Rahmen 205.9 × 269.4 mm
  kdp:     { label: 'KDP · LETTER',     w: 2267, h: 3088 }, // Motiv-Rahmen 191.9 × 261.4 mm (6 mm Bundsteg)
};
// Boards, die als Buchseite ins PDF-Tool wandern → Canvas exakt auf Rahmenmaß.
// Alle übrigen (1:1-Shop-Assets, 16:9-Teaser) werden nur eingepasst, nie gepolstert:
// ein quadratisches Etsy-Bild in einem Hochkant-Rahmen wäre kaputt.
const PDF_PAD_FMTS = ['front', 'back', 'whatsinside'];
// Von App bei jedem Render gesetzt, damit der PNG-Knopf an jedem Board dasselbe
// Ziel benutzt wie die Sammel-Exporte — ohne das Ziel durch 14 Board-Aufrufe zu fädeln.
const EXPORT_TARGET = { key:'off', target:null, bg:null };

// Ein Board für das PDF-Tool rastern. `pad` = Canvas exakt auf Rahmenmaß bringen,
// Rest mit der Ground-Farbe des Themes gefüllt (das Board-Seitenverhältnis 0.773
// trifft den Rahmen nicht exakt). Ohne Ziel: unverändertes Verhalten.
async function captureForTarget(node, fallbackScale, target, pad, bg) {
  if (!target || !target.w) return captureNode(node, fallbackScale);
  const bw = node.offsetWidth, bh = node.offsetHeight;
  if (!bw || !bh) return captureNode(node, fallbackScale);
  const W = Math.min(target.w, PDF_TARGET_CAP), H = Math.min(target.h, PDF_TARGET_CAP);
  const fit = Math.min(W / bw, H / bh);          // seitenverhältnis-erhaltend in den Rahmen
  const src = await captureNode(node, fit);
  const dw = Math.min(W, Math.round(bw * fit)), dh = Math.min(H, Math.round(bh * fit));
  // html2canvas rundet selbst auf ganze Pixel — passt es, ohne Padding direkt durchreichen.
  if (!pad && src.width === dw && src.height === dh) return src;
  const out = document.createElement('canvas');
  out.width = pad ? W : dw; out.height = pad ? H : dh;
  const ctx = out.getContext('2d');
  if (bg) { ctx.fillStyle = bg; ctx.fillRect(0, 0, out.width, out.height); }
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(src, Math.round((out.width - dw) / 2), Math.round((out.height - dh) / 2), dw, dh);
  return out;
}

// WebP kodieren, mit PNG-Fallback falls der Browser kein WebP-Encoding kann (toBlob → null).
function canvasToWebpBlob(canvas, quality = 0.82) {
  return new Promise(res => {
    canvas.toBlob(b => {
      if (b) return res({ blob: b, ext: 'webp' });
      canvas.toBlob(p => res({ blob: p, ext: 'png' }), 'image/png');
    }, 'image/webp', quality);
  });
}

/* ── USP collection (ported from v1, deutsche Labels) ─────────────────────── */
function activeUSPs(t) {
  const out = [];
  if (t.uspPbnTemplate)      out.push('PBN template page');
  if (t.uspPbnReference)     out.push('PBN reference preview');
  if (t.uspNormalFinelines)  out.push('Coloring pages — finelines');
  if (t.uspNormalManga)      out.push('Coloring pages — manga prefill');
  if (t.uspNormalGreyscales) out.push('Coloring pages — greyscales');
  if (t.uspMotifs)  { const s = (t.uspMotifsText || '').trim(); out.push(s ? 'Motifs: ' + s : 'Motifs'); }
  if (t.uspStyle)   { const s = (t.uspStyleText  || '').trim(); out.push(s ? 'Style: ' + s : 'Style'); }
  if (t.uspMarkerBrand)      out.push('Marker brand references');
  if (t.uspBonusPages) {
    const n = (t.uspBonusPagesCount || '').toString().trim(), s = (t.uspBonusPagesText || '').trim();
    const parts = []; if (n) parts.push(n); parts.push('bonus pages'); if (s) parts.push('— ' + s);
    out.push(parts.join(' '));
  }
  return out;
}

// 3b) Before & After Grid — mehrere Linework→koloriert-Paare untereinander (3 Reihen) oder

//     abschaltbar, damit die Folie nicht überladen wirkt. Bildquellen: eigene Paar-Slots
//     (imgs.baLine/baColor); Paar 1 fällt auf Hero-PBN/Hero zurück, damit ohne neue
//     Uploads schon etwas zu sehen ist.
function BeforeAfterGridCover({ theme, t, lineArt, colored, hero, heroPBN }) {
  const grid2 = t.baLayout === 'grid2x2';
  lineArt = lineArt || []; colored = colored || [];
  const pairs = Array.from({ length: grid2 ? 4 : 3 }, (_, i) => ({
    line:  lineArt[i] || (i === 0 ? heroPBN : null),
    color: colored[i] || (i === 0 ? hero : null),
  }));
  // „{pages}" im Feature-Text zieht Seitenzahl + Seiten-Wort aus den übrigen Einstellungen.
  const pagesLabel = `${t.pageCount} ${t.pageNoun || 'Pages'}`;
  const fill = s => (s || '').split('{pages}').join(pagesLabel).trim();
  const feats = !t.baShowFeatures ? []
    : (t.baFeatures || '').split('\n').map(s => s.trim()).filter(Boolean).slice(0, 4)
        .map(line => { const [h, ...rest] = line.split('::'); return { head:fill(h), sub:fill(rest.join('::')) }; });
  const footer = (t.baFooter || '').trim();
  const head = (t.baHeadline || '').split('\n').map(s => s.trim()).filter(Boolean);

  const PAD = 60, featW = feats.length ? 216 : 0, featGap = featW ? 28 : 0;
  const gridW = 1080 - 2 * PAD - featW - featGap;
  const top = 300, gridH = (footer ? 930 : 1010) - top;
  const rows = grid2 ? 2 : 3, cols = grid2 ? 2 : 1;
  const rowGap = 18, pairGap = 26, arrowW = grid2 ? 40 : 64;
  const cellH = (gridH - rowGap * (rows - 1)) / rows;
  const pairW = (gridW - pairGap * (cols - 1)) / cols;
  const tile = tileBox(ASSET_AR[t.assetAspect] || 1, (pairW - arrowW - 16) / 2, cellH);
  const rad = theme.frame === 'round' ? 14 : 6;
  const Tile = ({ src, ph }) => (
    <div style={{ width:tile.w, height:tile.h, boxSizing:'border-box', background:theme.frameBg,
      border:`1.5px solid ${theme.frameBorder}`, borderRadius:rad, padding:6, boxShadow:'0 6px 16px rgba(11,9,10,0.14)' }}>
      <ImgSlot src={src} radius={Math.max(2, rad - 3)} placeholder={ph} fit={t.assetFit || 'cover'} /></div>);
  const ICONS = [PrinterLine, FileLine, PagesLine, DownloadLine];

  return (<div style={{ width:1080, height:1080, background:theme.ground, position:'relative', overflow:'hidden', fontFamily:themeBody(theme) }}>
    <BgPattern t={t} ground={theme.ground} />
    {theme.motif === 'halftone' && <Halftone color={withAlpha(BRAND.white,0.06)} size={14} />}
    <SquareHead theme={theme} t={t} eyebrow={t.title} lines={head} />
    <div style={{ position:'absolute', top, left:PAD, height:gridH, width:1080 - 2 * PAD, display:'flex', gap:featGap }}>
      <div style={{ width:gridW, display:'flex', flexDirection:'column', gap:rowGap }}>
        {Array.from({ length:rows }).map((_, r) => (
          <div key={r} style={{ height:cellH, display:'flex', gap:pairGap, alignItems:'center', justifyContent:'center' }}>
            {Array.from({ length:cols }).map((_, c) => {
              const i = r * cols + c, p = pairs[i];
              return (<div key={c} style={{ width:pairW, display:'flex', alignItems:'center', justifyContent:'center', gap:8 }}>
                <Tile src={p.line} ph={`Line art ${i + 1}`} />
                <div style={{ width:arrowW, textAlign:'center', lineHeight:1, fontFamily:themeFont(theme),
                  fontSize:grid2 ? 30 : 42, color:theme.accentColor }}>→</div>
                <Tile src={p.color} ph={`Colored ${i + 1}`} />
              </div>); })}
          </div>))}
      </div>
      {!!feats.length && (
        <div style={{ width:featW, display:'flex', flexDirection:'column', justifyContent:'space-around', alignItems:'center', textAlign:'center' }}>
          {feats.map((f, i) => {
            const Icon = ICONS[i % ICONS.length];
            return (<div key={i} style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:9 }}>
              <div style={{ width:84, height:84, borderRadius:'50%', background:theme.badgeBg,
                display:'flex', alignItems:'center', justifyContent:'center', boxShadow:'0 6px 16px rgba(11,9,10,0.16)' }}>
                <Icon size={46} color={theme.badgeColor} w={3.4} /></div>
              <div style={{ fontFamily:themeFont(theme), fontSize:30, lineHeight:1.02, textTransform:'uppercase', color:theme.titleColor }}>{f.head}</div>
              {f.sub && <div style={{ fontFamily:themeBody(theme), fontSize:17, lineHeight:1.25, color:theme.subColor }}>{f.sub}</div>}
            </div>); })}
        </div>)}
    </div>
    {footer && <div style={{ position:'absolute', left:PAD, right:PAD, bottom:52, background:theme.badgeBg, color:theme.badgeColor,
      borderRadius:999, padding:'14px 28px', textAlign:'center', fontFamily:themeFont(theme), fontSize:30,
      textTransform:'uppercase', letterSpacing:'0.02em', boxShadow:'0 8px 20px rgba(11,9,10,0.18)' }}>{footer}</div>}
    <Watermark color={theme.watermark} text={t.website} show={t.showWebsite} />
  </div>);
}

  const h = (AREA_BOT - AREA_TOP - (n - 1) * gap) / n;

    <div style={{ position:'absolute', top:head.length > 1 ? 300 : 232, left:110, right:110, textAlign:'center',

    <div style={{ position:'absolute', top:AREA_TOP, bottom:1080 - AREA_BOT, left:70, right:70 }}>
      {/* Schiene hinter den Nummern — macht die Reihenfolge sichtbar, ohne Pfeil-Geklingel */}
      {n > 1 && <div style={{ position:'absolute', left:dot / 2 - 1, top:h / 2, bottom:h / 2, width:2,
        background:withAlpha(theme.accentColor, 0.35) }} />}
      <div style={{ position:'relative', display:'flex', flexDirection:'column', gap, height:'100%' }}>
        {steps.map((st, i) => (
          <div key={i} style={{ height:h, display:'flex', alignItems:'center', gap:22 * s }}>
            <div style={{ flex:'0 0 auto', width:dot, height:dot, borderRadius:'50%', background:theme.badgeBg, color:theme.badgeColor,
              border:`3px solid ${theme.ground}`, display:'flex', alignItems:'center', justifyContent:'center',
              fontFamily:ANTON, fontSize:Math.round(28 * s), lineHeight:1,
              boxShadow:'0 3px 10px rgba(11,9,10,0.18)' }}>{i + 1}</div>
            <div style={{ flex:'1 1 auto', minWidth:0, height:'100%', display:'flex', alignItems:'center', gap:20 * s,
              background:theme.frameBg, border:`${theme.frameBorderW}px solid ${theme.frameBorder}`, borderRadius:rad,
              padding:`${16 * s}px ${22 * s}px`, boxShadow:'0 6px 16px rgba(11,9,10,0.10)' }}>
              <div style={{ flex:'1 1 auto', minWidth:0 }}>
                <div style={{ fontFamily:themeFont(theme), fontSize:Math.round(30 * s), lineHeight:1.05,
                  textTransform:'uppercase', color:theme.titleColor }}>{st.title}</div>
                {st.what && <div style={{ marginTop:6 * s, fontFamily:themeBody(theme), fontSize:Math.round(20 * s),
                  lineHeight:1.35, color:theme.ink }}>{st.what}</div>}
              </div>
              {st.call && <div style={{ flex:'0 0 auto', width:Math.round(268 * s), alignSelf:'stretch',
                display:'flex', flexDirection:'column', justifyContent:'center', gap:4,
                background:withAlpha(theme.accentColor, 0.12), borderLeft:`3px solid ${theme.accentColor}`,
                borderRadius:6, padding:`${10 * s}px ${14 * s}px` }}>
                <div style={{ fontFamily:SANS, fontWeight:700, fontSize:Math.round(12 * s), letterSpacing:'0.14em',
                  textTransform:'uppercase', color:theme.accentColor }}>My call</div>
                <div style={{ fontFamily:themeBody(theme), fontSize:Math.round(18 * s), lineHeight:1.3, color:theme.ink }}>{st.call}</div>
              </div>}
            </div>
          </div>))}
      </div>
    </div>

    {/* Fußband: Claim + Werte-Chips */}
    <div style={{ position:'absolute', left:70, right:70, top:AREA_BOT + 20, background:BRAND.dark, borderRadius:14,

// 8) Comparison — „We vs. the others": zwei Spalten (Us/Them) mit 4 Vergleichszeilen
//    + Revival-Promise-Banner. Fest gepflegtes Base-Asset (wie About), aus t.cmp*.
//    Zeilen-Format je Zeile: „Us-Titel :: Us-Text || Them-Titel :: Them-Text".
function ComparisonCover({ theme, t }) {
  const GREY_BG = '#efece7', GREY_LINE = '#cfc9c1', GREY_INK = '#8a827a';
  const parseSide = s => { const [h, ...rest] = (s || '').split('::'); return { head:(h || '').trim(), text:rest.join('::').trim() }; };
  const rows = (t.cmpRows || '').split('\n').map(s => s.trim()).filter(Boolean).slice(0, 4).map(line => {
    const [us, them] = line.split('||').map(s => (s || '').trim());
    return { us:parseSide(us), them:parseSide(them) };
  });

/* ── Drag & drop file picker (click or drop an image) ─────────────────────── */
function DropFile({ label, filled, onFile }) {
  const [over, setOver] = useState(false);
  const pick = e => { const f = e.target.files[0]; if (f) onFile(f); e.target.value = ''; };
  const drop = e => { e.preventDefault(); setOver(false);
    const f = e.dataTransfer.files[0]; if (f && f.type.startsWith('image/')) onFile(f); };
  return (<label className={'drop' + (over ? ' over' : '') + (filled ? ' filled' : '')}
    onDragOver={e => { e.preventDefault(); setOver(true); }} onDragLeave={() => setOver(false)} onDrop={drop}>
    <input type="file" accept="image/*" onChange={pick} hidden />
    <span>{filled ? '✓ ' : ''}{label}</span>
  </label>);
}

// Robust in die Zwischenablage kopieren (navigator.clipboard scheitert auf file:// → Textarea-Fallback).
function copyText(str) {
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(str).catch(() => fallbackCopy(str));
  return Promise.resolve(fallbackCopy(str));
}
function fallbackCopy(str) {
  const ta = document.createElement('textarea');
  ta.value = str; ta.style.position = 'fixed'; ta.style.left = '-9999px';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(ta);
}

    return [series, vol, variant].filter(Boolean).join(' ') || 'Cover';
  }
  // Papierformate für den Print-PDF-Export. A4-Artboard (630×891) füllt A4 randlos;
  // bei abweichendem Seitenverhältnis (US-Letter) wird zentriert eingepasst statt verzerrt.
  const PDF_PAPERS = {
    a4:     { jsFormat:'a4',     w:210,   h:297,   label:'A4' },
    letter: { jsFormat:'letter', w:215.9, h:279.4, label:'US-Letter' },
  };
  // Ein gerendertes Artboard seitenverhältnis-erhaltend zentriert auf eine PDF-Seite legen.
  function placeContain(pdf, canvas, paper) {
    const ar = canvas.width / canvas.height;    // Seitenverhältnis des gerenderten Artboards
    let w = paper.w, h = w / ar;
    if (h > paper.h) { h = paper.h; w = h * ar; } // an Höhe einpassen, falls zu hoch
    const x = (paper.w - w) / 2, y = (paper.h - h) / 2; // zentriert (weiße Ränder)
    pdf.addImage(canvas.toDataURL('image/jpeg', 0.95), 'JPEG', x, y, w, h);
  }
  async function exportPDF(paperKey) {
    const paper = PDF_PAPERS[paperKey];
    const front = refs.current['front-' + themeKey]?.current;
    const back = refs.current['back-' + themeKey]?.current;
    if (!front || !paper) return;
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ unit:'mm', format:paper.jsFormat, orientation:'portrait' });
    placeContain(pdf, await captureNode(front, 4.85), paper);
    if (back) { pdf.addPage(); placeContain(pdf, await captureNode(back, 4.85), paper); }
    pdf.save(`cover-${themeKey}-${paper.label}.pdf`);
  }
  // KDP/Amazon: jede Print-Seite als eigene US-Letter-PDF-Datei (einzelne Downloads).
  const KDP_PAGES = [['front', 'Cover'], ['back', 'Back Cover'], ['whatsinside', "What's Inside"]];
  async function exportKDP() {
    const base = exportBase(), paper = PDF_PAPERS.letter;
    const { jsPDF } = window.jspdf;
    for (const [fmt, lbl] of KDP_PAGES) {
      const node = refs.current[fmt + '-' + themeKey]?.current;
      if (!node) continue;
      const pdf = new jsPDF({ unit:'mm', format:paper.jsFormat, orientation:'portrait' });
      placeContain(pdf, await captureNode(node, 4.85), paper);
      pdf.save(`${base} ${lbl} (US-Letter).pdf`);
      await new Promise(r => setTimeout(r, 350)); // Browser-Download-Sperre vermeiden
    }
  }
  async function exportAllPNG() {
    const base = exportBase();
    for (const [fmt, sc, lbl] of allJobs) {
      const node = refs.current[fmt + '-' + themeKey]?.current; if (!node) continue;
      downloadCanvas(await captureJob(node, fmt, sc), `${base} ${lbl}${targetTag}.png`);
      await new Promise(r => setTimeout(r, 350));
    }
  }
  // Komplett-ZIP: druckfertige PNGs (Ordner PNG/) UND die cleanen Web-WebPs ohne Badges
  // (Ordner WEB/) in einer Datei — der Regelfall, deshalb ein einziger Button.
  async function exportZipAll() {
    const base = exportBase();
    const zip = new JSZip();
    for (const [fmt, sc, lbl] of allJobs) {
      const node = refs.current[fmt + '-' + themeKey]?.current; if (!node) continue;
      const canvas = await captureJob(node, fmt, sc);
      const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
      zip.file(`PNG/${base} ${lbl}${targetTag}.png`, blob);
    }
    const prev = { showBadges: t.showBadges, promoBadge: t.promoBadge };
    ReactDOM.flushSync(() => setT(s => ({ ...s, showBadges:false, promoBadge:false })));
    try {
      for (const [fmt, , lbl] of allJobs) {
        const node = refs.current[fmt + '-' + themeKey]?.current; if (!node) continue;
        const full = await captureNode(node, 2); // 2× Quelle, dann sauber heruntergerechnet
        const { blob, ext } = await canvasToWebpBlob(scaleCanvasToMax(full, WEB_MAX_EDGE));
        zip.file(`WEB/${base} ${lbl} web.${ext}`, blob);
      }
    } finally {
      ReactDOM.flushSync(() => setT(s => ({ ...s, ...prev })));
    }
    const zipBlob = await zip.generateAsync({ type:'blob' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(zipBlob); a.download = `${base} Assets${targetTag}.zip`;
    a.click(); URL.revokeObjectURL(a.href);
  }
  // Export mit Status-Label in der Kopfleiste; sperrt solange die übrigen Export-Buttons.
  async function run(label, fn) {
    if (busy) return;
    setBusy(label + ' …');
    try { await fn(); }
    catch (e) { console.error(e); window.alert('Export fehlgeschlagen: ' + (e && e.message ? e.message : e)); }
    finally { setBusy(''); }
  }

  // Kompletten Stand (alle Themes: Texte, Farben, Schriften UND Bilder) als .json sichern.
  async function saveProject() {
    setSavingProject(true);
    try {
      const data = {
        __cd2: true, version: PROJECT_VERSION, savedAt: new Date().toISOString(),
        themeKey, t, colorsByTheme, blurbByTheme, hookByTheme, fontByTheme,
        imagesByTheme: await serializeImages(imagesByTheme),
      };
      const blob = new Blob([JSON.stringify(data)], { type:'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `${exportBase()} — Cover-Projekt.json`;
      a.click(); URL.revokeObjectURL(a.href);
    } finally { setSavingProject(false); }
  }
  // Gesicherten Stand wieder einspielen — ersetzt den aktuellen Stand komplett.
  function loadProject(file) {
    if (!file) return;
    const fr = new FileReader();
    fr.onload = () => {
      let data;
      try { data = JSON.parse(fr.result); }
      catch (e) { window.alert('Datei konnte nicht gelesen werden (kein gültiges JSON).'); return; }
      if (!data || !data.__cd2) {
        if (!window.confirm('Das sieht nicht nach einem Cover-Projekt aus. Trotzdem versuchen zu laden?')) return;
      }
      if (!window.confirm('Aktuellen Stand durch das geladene Projekt ersetzen?')) return;
      // Alte ObjectURLs freigeben, bevor sie ersetzt werden (kein Speicher-Leck).
      Object.values(imagesByTheme || {}).forEach(v => {
        if (!v) return;
        [v.hero, v.heroPBN, ...(v.pages || []), ...(v.baLine || []), ...(v.baColor || [])].forEach(u => {
          if (u && typeof u === 'string' && u.startsWith('blob:')) { try { URL.revokeObjectURL(u); } catch (e) {} }
        });
      });
      if (data.t)             setT({ ...DEFAULTS, ...data.t });
      if (data.colorsByTheme) setColorsByTheme(data.colorsByTheme);
      if (data.blurbByTheme)  setBlurbByTheme(data.blurbByTheme);
      if (data.hookByTheme)   setHookByTheme(data.hookByTheme);
      if (data.fontByTheme)   setFontByTheme(data.fontByTheme);
      if (data.imagesByTheme) setImagesByTheme(data.imagesByTheme); // data:-URLs → direkt als src nutzbar
      if (data.themeKey && THEMES[data.themeKey]) setThemeKey(data.themeKey);
    };
    fr.readAsText(file);
  }

  // erzeugte Arrow-Function, würde React den kompletten Sektions-Teilbaum bei jedem Tastendruck

          onChange={e => setPdfTarget(e.target.value)}>
          {Object.entries(PDF_TARGETS).map(([k, v]) =>
            <option key={k} value={k}>{'PNG-Ziel: ' + v.label}</option>)}
        </select>
        {pngTarget && <span className="hnote">{pngTarget.w} × {pngTarget.h} px</span>}
        <button className="hbtn primary" disabled={!!busy} onClick={() => run('ZIP komplett', exportZipAll)}>

        <button className="hbtn" disabled={!!busy} onClick={() => run('A4-PDF', () => exportPDF('a4'))}>A4-PDF</button>
        <button className="hbtn" disabled={!!busy} onClick={() => run('US-Letter-PDF', () => exportPDF('letter'))}>US-Letter</button>
        <button className="hbtn" disabled={!!busy} onClick={() => run('KDP-Einzel-PDFs', exportKDP)}>KDP einzeln</button>
        <button className="hbtn" disabled={!!busy} onClick={() => run('PNG einzeln', exportAllPNG)}>PNG einzeln</button>
