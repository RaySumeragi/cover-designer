                </select></div>
              <span className="hint">Klicken oder Bild hineinziehen · pro Theme. Back/What's-Inside nutzen Bild 1–4, Gallery alle 8.
                Format/Anpassung gelten für Back, What's Inside &amp; Gallery.</span>
            </div>
          </>}
        </div>
        <div className="stage-bar">
          <span className="zl">Zoom</span>
          {[null, 0.5, 0.75, 1.0].map(z => (
            <button key={String(z)} className={'zoom-btn' + (zoom === z ? ' on' : '')} onClick={() => setZoom(z)}>
              {z === null ? 'Fit' : Math.round(z * 100) + '%'}</button>))}
        </div>
        <div className="boards">
          <div className="board-group">
            <div className="board-group-head">
              <span className="g-t">Gumroad · Direktverkauf</span>
              <span className="g-sub">US-Letter-Cover-Set + Marketing-Formate</span>
            </div>
            <div className="board-row">
              <Board key={'front-' + themeKey} w={PAGE_W} h={PAGE_H} scale={zoom != null ? zoom : 0.42} label="US Letter Front" pngScale={4.85} fileBase={'front-' + themeKey} registerRef={registerRef}>
                <FrontCover theme={view} t={t} hero={imgs.hero} heroPBN={imgs.heroPBN} pages={imgs.pages} /></Board>
              <Board key={'back-' + themeKey} w={PAGE_W} h={PAGE_H} scale={zoom != null ? zoom : 0.42} label="US Letter Back" pngScale={4.85} fileBase={'back-' + themeKey} registerRef={registerRef}>
                <BackCover theme={view} t={t} pages={imgs.pages} blurb={blurbVal} hook={hookLines} /></Board>
              <Board key={'whatsinside-' + themeKey} w={PAGE_W} h={PAGE_H} scale={zoom != null ? zoom : 0.42} label="US Letter What's Inside" pngScale={4.85} fileBase={'whatsinside-' + themeKey} registerRef={registerRef}>
                <WhatsInsideCover theme={view} t={t} pages={imgs.pages} /></Board>
              {uiMode === 'voll' && <Board key={'thumb-' + themeKey} w={540} h={540} scale={zoom != null ? zoom : 0.5} label="Thumbnail 1:1" fileBase={'thumb-' + themeKey} registerRef={registerRef}>
                <ThumbCover theme={view} t={t} hero={imgs.hero} heroPBN={imgs.heroPBN} pages={imgs.pages} /></Board>}
              {uiMode === 'voll' && <Board key={'gallery-' + themeKey} w={960} h={540} scale={zoom != null ? zoom : 0.42} label="Gallery 16:9" fileBase={'gallery-' + themeKey} registerRef={registerRef}>
                <GalleryCover theme={view} t={t} pages={imgs.pages} /></Board>}
              {uiMode === 'voll' && <Board key={'teaser-' + themeKey} w={960} h={540} scale={zoom != null ? zoom : 0.42} label="Teaser 16:9" fileBase={'teaser-' + themeKey} registerRef={registerRef}>
                <TeaserCover theme={view} t={t} hero={imgs.hero} heroPBN={imgs.heroPBN} pages={imgs.pages} /></Board>}
            </div>
          </div>

          <div className="board-divider" />

          <div className="board-group">
            <div className="board-group-head">
              <span className="g-t">Etsy · Square-Assets</span>
              <span className="g-sub">1:1 Listing-Bilder · pro Cover einstellbar</span>
            </div>
            <div className="board-row">
              {t.shopHero && <Board key={'etsyhero-' + themeKey} w={1080} h={1080} scale={zoom != null ? zoom : 0.25} label="Shop · Hero 1:1" fileBase={'etsyhero-' + themeKey} registerRef={registerRef}>
                <EtsyHeroCover theme={view} t={t} hero={imgs.hero} heroPBN={imgs.heroPBN} pages={imgs.pages} /></Board>}
              {t.shopBundle && <Board key={'bundlegrid-' + themeKey} w={1080} h={1080} scale={zoom != null ? zoom : 0.25} label="Shop · In This Bundle 1:1" fileBase={'bundlegrid-' + themeKey} registerRef={registerRef}>
                <BundleGridCover theme={view} t={t} hero={imgs.hero} pages={imgs.pages} /></Board>}
              {t.shopBeforeAfter && <Board key={'beforeafter-' + themeKey} w={1080} h={1080} scale={zoom != null ? zoom : 0.25} label="Shop · Linework + Colored 1:1" fileBase={'beforeafter-' + themeKey} registerRef={registerRef}>
                <BeforeAfterCover theme={view} t={t} hero={imgs.hero} heroPBN={imgs.heroPBN} /></Board>}
              {t.shopBAGrid && <Board key={'bagrid-' + themeKey} w={1080} h={1080} scale={zoom != null ? zoom : 0.25} label="Shop · Before & After 1:1" fileBase={'bagrid-' + themeKey} registerRef={registerRef}>
                <BeforeAfterGridCover theme={view} t={t} lineArt={imgs.baLine} colored={imgs.baColor} hero={imgs.hero} heroPBN={imgs.heroPBN} /></Board>}
            </div>
          </div>
        </div>
      </main>

      <div className="resizer" onMouseDown={e => startResize(e, 'right')} title="Template-Sidebar breiter/schmaler ziehen" />
      <aside className="panel panel-r" style={{ width:panelRW }}>
        <div className="panel-h">Template<span>Theme, Farben, Schrift, Layout & Muster</span></div>

        <Sec tier="basis" title="Theme">
          <div className="themes">
            {Object.keys(THEMES).map(k => {
              const v = resolveColors(THEMES[k], colorsByTheme[k]);
              const rad = v.frame === 'arch' ? '40% 40% 2px 2px / 55% 55% 2px 2px' : v.frame === 'round' ? '6px' : '2px';
              return (
                <button key={k} className={'theme-btn' + (k === themeKey ? ' on' : '')} onClick={() => setThemeKey(k)} title={k}>
                  <span className="theme-prev" style={{ background:v.ground }}>
                    <span className="theme-prev-frame" style={{ background:v.frameBg, border:`1.5px solid ${v.frameBorder}`, borderRadius:rad }} />
                    <span className="theme-prev-title" style={{ color:v.titleColor, fontFamily:v.titleFont || 'inherit' }}>Title</span>
                    <span className="theme-prev-dots">
                      <span className="theme-prev-dot" style={{ background:v.accentColor }} />
                      <span className="theme-prev-dot" style={{ background:v.badgeBg }} />
                    </span>
                  </span>
                  <span className="theme-name">{k}</span>
                </button>);
            })}
          </div>
        </Sec>

        <Sec tier="basis" title={<>Farben ({themeKey})</>}>
          <div className="palettes">
            {(PALETTE_PRESETS[themeKey] || []).map((p, i) => {
              const on = COLOR_TOKENS.every(([tok]) => view[tok] === p[tok]);
              return (<button key={i} className={'pal-btn' + (on ? ' on' : '')} title={p.name} onClick={() => applyPalette(p)}>
                <span className="pal-bar" style={{ background:p.titleColor }} />
                <span className="pal-row" style={{ background:p.ground }}>
                  <span className="pal-dot" style={{ background:p.accentColor }} />
                  <span className="pal-dot" style={{ background:p.badgeBg }} />
                </span>
              </button>);
            })}
          </div>
          <div className="colors-grid">
            {COLOR_TOKENS.map(([tok, lbl]) => (
              <label key={tok} className="color-cell"><input type="color" value={view[tok]} onChange={e => setColor(tok, e.target.value)} /> {lbl}</label>))}
          </div>
          <button className="btn sec-btn" onClick={resetColors}>Farben zurücksetzen</button>
        </Sec>

        <Sec tier="basis" title={<>Schrift ({themeKey}){fontEdited && <span style={{ color:'var(--gold)' }}> · angepasst</span>}</>}>
          <div className="row"><label>Titel-Schrift (Titel, Back-Überschrift, Autor)</label>
            <select value={fontSel.title || ''} onChange={e => setFont('title', e.target.value)}>
              {FONT_OPTIONS.map(f => <option key={f.label} value={f.v}>{f.label}</option>)}
            </select></div>
          <div className="row"><label>Text-Schrift (Klappentext, Listen)</label>
            <select value={fontSel.body || ''} onChange={e => setFont('body', e.target.value)}>
              {FONT_OPTIONS.map(f => <option key={f.label} value={f.v}>{f.label}</option>)}
            </select></div>
          <div className="hint">„Theme-Standard" = die zum Preset gehörende Schrift. Wirkt auf alle Artboards.</div>
          {fontEdited && <button className="btn sec-btn" onClick={resetFonts}>Schrift zurücksetzen</button>}
        </Sec>

        <Sec tier="basis" title="Cover-Layout & Muster">
          <div className="row"><label>Hero-Anordnung</label>
            <select value={t.frontLayout} onChange={e => set('frontLayout', e.target.value)}>
              <option value="single">Einzeln (groß)</option>
              <option value="fullbleed">Vollbild (randlos, Titel im Bild)</option>
              <option value="bigtop3">Groß + 3 klein</option>
              <option value="grid4">2×2 Raster</option>
              <option value="circle">Kreis</option>
            </select></div>
          <div className="hint">Wirkt auf Front, Thumbnail & Teaser. Vollbild: Hero füllt randlos, Titel liegt schräg über der hellen PBN-Seite — ohne Muster/Rahmen (Hero + Hero-PBN für den Split-Effekt laden). Collage/Raster nutzen Hero + Back-Bilder 1–3.</div>
          <div className="row"><label>Hintergrund-Muster</label>
            {/* Muster-Wechsel zieht Größe/Stärke auf die Vorgaben des neuen Musters nach —
                Raster wollen ~22px, Motive 50–90px, sonst wirken sie gequetscht. */}
            <select value={t.bgPattern} onChange={e => {
              const k = e.target.value, def = StudioDesign.PATTERNS[k];
              set('bgPattern', k);
              if (def) { set('bgPatternSize', def.cell); set('bgPatternStroke', def.stroke); }
            }}>
              <option value="theme">Theme-Standard</option>
              <option value="none">Keins</option>
              <optgroup label="Raster">
                {StudioDesign.patternKeys('basic').map(k => <option key={k} value={k}>{BG_PATTERNS[k].label}</option>)}
              </optgroup>
              <optgroup label="Motive">
                {StudioDesign.patternKeys('motif').map(k => <option key={k} value={k}>{BG_PATTERNS[k].label}</option>)}
              </optgroup>
            </select></div>
          {BG_PATTERNS[t.bgPattern] && BG_PATTERNS[t.bgPattern].kind && <>
            <div className="files-grid">
              <div className="row"><label>Größe (px)</label>
                <input type="number" min="4" max="160" value={t.bgPatternSize}
                  onChange={e => set('bgPatternSize', Math.max(4, Math.min(160, Number(e.target.value) || 22)))} /></div>
              <div className="row"><label>Deckkraft (0–0.6)</label>
                <input type="number" min="0" max="0.6" step="0.01" value={t.bgPatternOpacity}
                  onChange={e => set('bgPatternOpacity', Math.max(0, Math.min(0.6, Number(e.target.value) || 0)))} /></div>
            </div>
            <div className="row w-s"><label>Linienstärke</label>
              <input type="number" min="0.2" max="8" step="0.1" value={t.bgPatternStroke || StudioDesign.PATTERNS[t.bgPattern].stroke}
                onChange={e => set('bgPatternStroke', Math.max(0.2, Math.min(8, Number(e.target.value) || 1)))} /></div>
            <label className="check"><input type="checkbox" checked={t.bgPatternAuto} onChange={e => set('bgPatternAuto', e.target.checked)} /> Farbe automatisch (an Grund anpassen)</label>
            {!t.bgPatternAuto &&
              <div className="row"><label>Muster-Farbe</label>
                <div className="colors"><label><input type="color" value={t.bgPatternColor} onChange={e => set('bgPatternColor', e.target.value)} /> Muster</label></div></div>}
          </>}
          <PatternHandoff t={t} set={set} />
        </Sec>

        <Sec tier="voll" title="Einstellungen">
          <div className="hint">Texte, Theme & Farben werden automatisch im Browser gespeichert (Bilder nicht — dafür „Projekt speichern").</div>
          <button className="btn sec-btn" onClick={resetSettings}>Einstellungen zurücksetzen</button>
        </Sec>
      </aside>
    </div>

    {/* ── Base-Infos-Ansicht — fest gepflegte Angaben (Autor/Webseite + Etsy-Assets).
        Bleibt off-screen gemountet, damit ihre Boards für den Export gerendert bleiben. ── */}
    <div className={'view view-base' + (tab === 'base' ? ' on' : '')}>
      <div className="base-head">
        <h2>Base Infos</h2>
        <span className="bi-sub">Einmalig gepflegt · gilt für alle Cover</span>
        <button className="base-copy" onClick={copyBaseCode}>{baseCopied ? '✓ Kopiert' : '⧉ Als Code kopieren'}</button>
      </div>
      <div className="base-note">
        Änderungen werden im Browser gespeichert (localStorage). Für <b>dauerhafte</b> Base-Infos, die in beiden Kopien und ohne
        <code>file://</code>-Grenzen gelten: „⧉ Als Code kopieren" und das Snippet in <code>DEFAULTS</code> (in <code>index.html</code>) einfügen.
        Tipp: Tool über einen lokalen Server (localhost) statt per Doppelklick öffnen, dann persistiert localStorage zuverlässig.
      </div>
      <div className="base-body">
        <div className="base-fields">
            <Sec tier="basis" title="Autor & Webseite">
              <div className="row w-m"><label>Autor</label><input type="text" value={t.author} onChange={e => set('author', e.target.value)} /></div>
              <div className="row w-m"><label>Webseite (Wasserzeichen)</label><input type="text" value={t.website} placeholder="z.B. rias-colorlabs.com" onChange={e => set('website', e.target.value)} /></div>
              <div className="hint">Der Ein/Aus-Schalter für das Wasserzeichen sitzt im Design-Tab unter „Badges & Stempel".</div>
            </Sec>
            <Sec tier="basis" title="Print or Digital">
              <label className="check"><input type="checkbox" checked={t.shopFormats === true} onChange={e => set('shopFormats', e.target.checked)} /> Asset in Export einschließen</label>
              <div className="row w-s"><label>Modus</label>
                <select value={t.formatMode} onChange={e => set('formatMode', e.target.value)}>
                  <option value="both">Beides</option>
                  <option value="print">Nur Print</option>
                  <option value="digital">Nur Digital</option>
                </select></div>
              {t.formatMode !== 'digital' && <div className="row"><label>Print-Text</label><textarea rows={3} value={t.printText} onChange={e => set('printText', e.target.value)} /></div>}
              {t.formatMode !== 'print' && <div className="row"><label>Digital-Text</label><textarea rows={3} value={t.digitalText} onChange={e => set('digitalText', e.target.value)} /></div>}
            </Sec>
            <Sec tier="basis" title="Human in the Loop (Prozess)">
              <label className="check"><input type="checkbox" checked={t.shopHuman === true} onChange={e => set('shopHuman', e.target.checked)} /> Asset in Export einschließen</label>
              <div className="row"><label>Überschrift (eine Zeile = eine Headline-Zeile)</label><textarea rows={2} value={t.hilHeadline} onChange={e => set('hilHeadline', e.target.value)} /></div>
              <div className="row"><label>Tagline</label><input type="text" value={t.hilTagline} onChange={e => set('hilTagline', e.target.value)} /></div>
              <div className="row"><label>Schritte (je Zeile: Titel :: was passiert :: meine Entscheidung)</label>
                <textarea style={{ minHeight:150 }} value={t.hilSteps} onChange={e => set('hilSteps', e.target.value)} /></div>
              <div className="hint">Max. <b>5 Schritte</b> — darüber wird auf 1080×1080 nichts mehr lesbar (überzählige Zeilen werden ignoriert). Der dritte Teil (<code>::</code>) landet im „My call"-Kasten rechts; er ist optional.</div>
              <div className="row"><label>Claim (Fußband, eine Zeile = eine Zeile)</label><textarea rows={2} value={t.hilClaim} onChange={e => set('hilClaim', e.target.value)} /></div>
              <div className="row"><label>Werte-Chips (eine Zeile = ein Chip, max. 6)</label><textarea rows={3} value={t.hilValues} onChange={e => set('hilValues', e.target.value)} /></div>
              <div className="hint">Letzte Überschrift-Zeile erscheint in der Akzentfarbe.</div>
            </Sec>
            <Sec tier="basis" title="About Ria & Ray">
              <label className="check"><input type="checkbox" checked={t.shopAbout === true} onChange={e => set('shopAbout', e.target.checked)} /> Asset in Export einschließen</label>
              <div className="row"><label>Intro</label><textarea rows={3} value={t.aboutIntro} onChange={e => set('aboutIntro', e.target.value)} /></div>
              <div className="row"><label>Über Ria</label><textarea rows={2} value={t.aboutRia} onChange={e => set('aboutRia', e.target.value)} /></div>
              <div className="row"><label>Über Ray</label><textarea rows={2} value={t.aboutRay} onChange={e => set('aboutRay', e.target.value)} /></div>
              <div className="row"><label>Outro (optional)</label><textarea rows={3} value={t.aboutOutro} onChange={e => set('aboutOutro', e.target.value)} /></div>
              <div className="sec-t" style={{ marginTop:4 }}>Bilder (rund, in den Bio-Karten · leer = Initiale)</div>
              <div className="files-grid">
                <DropFile label={(t.aboutRiaImg ? '✓ ' : '') + 'Ria-Bild'} filled={!!t.aboutRiaImg} onFile={f => readBaseImg(f, 'aboutRiaImg')} />
                <DropFile label={(t.aboutRayImg ? '✓ ' : '') + 'Ray-Bild'} filled={!!t.aboutRayImg} onFile={f => readBaseImg(f, 'aboutRayImg')} />
              </div>
              {(t.aboutRiaImg || t.aboutRayImg) &&
                <div style={{ display:'flex', gap:8 }}>
                  {t.aboutRiaImg && <button className="btn sec-btn" style={{ flex:1 }} onClick={() => set('aboutRiaImg', '')}>Ria-Bild entfernen</button>}
                  {t.aboutRayImg && <button className="btn sec-btn" style={{ flex:1 }} onClick={() => set('aboutRayImg', '')}>Ray-Bild entfernen</button>}
                </div>}
              <div className="files-grid">
                <div className="row"><label>Marke</label><input type="text" value={t.socialBrand} onChange={e => set('socialBrand', e.target.value)} /></div>
                <div className="row"><label>Instagram</label><input type="text" value={t.socialInsta} onChange={e => set('socialInsta', e.target.value)} /></div>
                <div className="row"><label>YouTube</label><input type="text" value={t.socialYoutube} onChange={e => set('socialYoutube', e.target.value)} /></div>
                <div className="row"><label>E-Mail</label><input type="text" value={t.socialEmail} onChange={e => set('socialEmail', e.target.value)} /></div>
              </div>
            </Sec>
            <Sec tier="basis" title="Comparison (We vs. others)">
              <label className="check"><input type="checkbox" checked={t.shopComparison === true} onChange={e => set('shopComparison', e.target.checked)} /> Asset in Export einschließen</label>
              <div className="row w-m"><label>Eyebrow</label><input type="text" value={t.cmpEyebrow} onChange={e => set('cmpEyebrow', e.target.value)} /></div>
              <div className="row"><label>Titel (eine Zeile = eine Headline-Zeile)</label><textarea rows={2} value={t.cmpTitle} onChange={e => set('cmpTitle', e.target.value)} /></div>
              <div className="row"><label>Untertitel</label><textarea rows={2} value={t.cmpSub} onChange={e => set('cmpSub', e.target.value)} /></div>
              <div className="files-grid">
                <div className="row"><label>Spalte „Us"</label><input type="text" value={t.cmpUsName} onChange={e => set('cmpUsName', e.target.value)} /></div>
                <div className="row"><label>Spalte „Them"</label><input type="text" value={t.cmpThemName} onChange={e => set('cmpThemName', e.target.value)} /></div>
              </div>
              <div className="row"><label>Zeilen (je Zeile: Us-Titel :: Us-Text || Them-Titel :: Them-Text · max. 4)</label><textarea style={{ minHeight:120 }} value={t.cmpRows} onChange={e => set('cmpRows', e.target.value)} /></div>
              <div className="hint">Trennzeichen: <code>::</code> zwischen Titel und Text, <code>||</code> zwischen Us- und Them-Seite.</div>
              <div className="row w-m"><label>Revival-Titel</label><input type="text" value={t.cmpRevivalTitle} onChange={e => set('cmpRevivalTitle', e.target.value)} /></div>
              <div className="row"><label>Revival-Text</label><textarea rows={4} value={t.cmpRevivalText} onChange={e => set('cmpRevivalText', e.target.value)} /></div>
              <div className="row"><label>Badge (Fußzeile)</label><input type="text" value={t.cmpBadge} onChange={e => set('cmpBadge', e.target.value)} /></div>
            </Sec>
        </div>
        <div className="base-previews">
          {t.shopFormats && <Board key={'printdigital-' + themeKey} w={1080} h={1080} scale={0.3} label="Shop · Print or Digital 1:1" fileBase={'printdigital-' + themeKey} registerRef={registerRef}>
            <PrintDigitalCover theme={view} t={t} /></Board>}
          {t.shopHuman && <Board key={'humanloop-' + themeKey} w={1080} h={1080} scale={0.3} label="Shop · Human in the Loop 1:1" fileBase={'humanloop-' + themeKey} registerRef={registerRef}>
            <HumanLoopCover theme={view} t={t} /></Board>}
          {t.shopAbout && <Board key={'about-' + themeKey} w={1080} h={1080} scale={0.3} label="Shop · About 1:1" fileBase={'about-' + themeKey} registerRef={registerRef}>
            <AboutCover theme={view} t={t} /></Board>}
          {t.shopComparison && <Board key={'comparison-' + themeKey} w={1080} h={1080} scale={0.3} label="Shop · Comparison 1:1" fileBase={'comparison-' + themeKey} registerRef={registerRef}>
            <ComparisonCover theme={view} t={t} /></Board>}
        </div>
      </div>
    </div>
  </div>);
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
